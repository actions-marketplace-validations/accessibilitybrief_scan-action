# Checks the action itself on Linux, macOS and Windows runners. Without a real key the scan must stop with the
# CLI's "key not accepted" error, which proves inputs reach the command line tool and errors fail the step.
name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wrong-key-fails:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          url: https://example.com
          api-key: ab_live_not_a_real_key
          fail-on: serious
      - name: The step must fail
        shell: bash
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then echo "Expected the scan step to fail with a wrong key"; exit 1; fi
          echo "Scan step failed as expected."
